<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkopjeVibes – Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #0d0d0d; color: #f5f0e8; min-height: 100vh; padding: 24px 20px 60px; }

    /* Login screen */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }
    #login-screen h2 { font-family: 'Syne', sans-serif; font-size: 24px; }
    #login-screen input { width: 260px; background: #161616; border: 1px solid #2a2a2a; color: #f5f0e8; padding: 12px 16px; border-radius: 12px; font-size: 15px; outline: none; }
    #login-screen button { width: 260px; background: #ff5c35; color: #fff; border: none; border-radius: 12px; padding: 13px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; }
    #login-error { color: #ff5c35; font-size: 13px; display: none; }

    /* Admin panel */
    #admin-panel { display: none; max-width: 500px; margin: 0 auto; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid #1f1f1f; }
    .admin-header h1 { font-family: 'Syne', sans-serif; font-size: 20px; }
    .admin-header h1 span { color: #ff5c35; }
    .logout-btn { font-size: 12px; color: #555; cursor: pointer; border: 1px solid #2a2a2a; padding: 5px 12px; border-radius: 20px; background: none; color: #888; }

    .section-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 16px; color: #ff5c35; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 6px; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: #161616;
      border: 1px solid #2a2a2a;
      color: #f5f0e8;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: #ff5c35; }
    .form-group select option { background: #161616; }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .date-row { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; }

    .submit-btn {
      width: 100%;
      background: #ff5c35;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .submit-btn:hover { background: #ff4520; }
    .submit-btn:disabled { background: #333; cursor: not-allowed; }

    .success-msg { background: #0a2a0a; border: 1px solid #1a4a1a; color: #4cff91; padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-top: 14px; display: none; text-align: center; }
    .error-msg   { background: #2a0a0a; border: 1px solid #4a1a1a; color: #ff5c35; padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-top: 14px; display: none; text-align: center; }

    /* Events list */
    .events-section { margin-top: 36px; }
    .event-item { background: #161616; border: 1px solid #1f1f1f; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .event-info { flex: 1; min-width: 0; }
    .event-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-meta  { font-size: 11px; color: #555; margin-top: 2px; }
    .delete-btn  { flex-shrink: 0; background: #2a0a0a; border: 1px solid #4a1a1a; color: #ff5c35; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; transition: background 0.15s; }
    .delete-btn:hover { background: #3a0a0a; }
    .edit-btn    { flex-shrink: 0; background: #0a1a2a; border: 1px solid #1a3a5a; color: #5599ff; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; transition: background 0.15s; }
    .edit-btn:hover { background: #0f2540; }
    .event-actions { display: flex; gap: 6px; }
    .cancel-btn  { width: 100%; background: none; border: 1px solid #2a2a2a; color: #888; border-radius: 14px; padding: 12px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 8px; transition: border-color 0.15s; display: none; }
    .cancel-btn:hover { border-color: #555; color: #f5f0e8; }
    .empty-list { text-align: center; color: #444; font-size: 13px; padding: 24px 0; }
    #events-search {
      width: 100%;
      background: #161616;
      border: 1px solid #2a2a2a;
      color: #f5f0e8;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 12px;
    }
    #events-search:focus { border-color: #ff5c35; }
    #events-search::placeholder { color: #444; }

    .img-field-wrap { display: flex; gap: 8px; }
    .img-field-wrap input { flex: 1; min-width: 0; }
    .upload-btn {
      flex-shrink: 0; background: #1f1f1f; border: 1px solid #2a2a2a; color: #aaa;
      border-radius: 12px; padding: 0 14px; font-size: 13px; font-family: 'DM Sans', sans-serif;
      cursor: pointer; white-space: nowrap; transition: border-color 0.15s, color 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .upload-btn:hover { border-color: #ff5c35; color: #f5f0e8; }

    /* Geocoder */
    .place-row { display: flex; gap: 8px; align-items: stretch; }
    .place-row input { flex: 1; min-width: 0; }
    .geo-btn {
      flex-shrink: 0; background: #1f1f1f; border: 1px solid #2a2a2a; color: #aaa;
      border-radius: 12px; padding: 0 14px; font-size: 13px; font-family: 'DM Sans', sans-serif;
      cursor: pointer; white-space: nowrap; transition: border-color 0.15s, color 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .geo-btn:hover:not(:disabled) { border-color: #ff5c35; color: #f5f0e8; }
    .geo-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .geo-error { font-size: 11px; color: #ff5c35; margin-top: 6px; display: none; }

    /* Coord map preview */
    #coord-map-wrap { margin-top: 12px; display: none; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a2a; }
    #coord-map { height: 220px; width: 100%; }
    .coord-map-hint { font-size: 11px; color: #555; padding: 6px 10px 8px; background: #111; text-align: center; }
    .t5-bottom-bar { border-radius: 0 0 12px 12px; }

  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <h2>🔐 Admin панел</h2>
  <input type="email"    id="email-input" placeholder="Е-пошта" onkeydown="if(event.key==='Enter')checkLogin()" />
  <input type="password" id="pwd-input"   placeholder="Лозинка" onkeydown="if(event.key==='Enter')checkLogin()" />
  <button onclick="checkLogin()">Влез</button>
  <span id="login-error"></span>
  <a href="#" id="forgot-link" onclick="resetPassword()" style="color:#666; font-size:12px; text-decoration:underline; cursor:pointer; margin-top:4px;">Заборавена лозинка?</a>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel">
  <div class="admin-header">
    <h1>Skopje<span>Vibes</span> Admin</h1>
    <button class="logout-btn" onclick="logout()">Излез</button>
  </div>

  <!-- AI AGENT -->
  <div class="section-title">🤖 AI Агент</div>
  <div class="form-group">
    <label>Прикачи screenshot од Instagram пост</label>
    <input type="file" id="ai-image-input" accept="image/*" style="background:#161616;border:1px solid #2a2a2a;border-radius:12px;padding:11px 14px;width:100%;color:#aaa;cursor:pointer" />
  </div>
  <div id="ai-preview-wrap" style="display:none;margin-bottom:12px">
    <img id="ai-preview" style="width:100%;border-radius:12px;max-height:300px;object-fit:contain;background:#111" />
  </div>
  <div id="convert-btns" style="display:none;gap:8px;margin-bottom:12px">
    <button onclick="openTemplate5()" style="flex:1;background:none;border:1px solid #ff5c35;color:#ff5c35;padding:10px;border-radius:10px;cursor:pointer;font-size:13px">📥 Симни со Template 5</button>
    <button onclick="convertImage('story')" style="flex:1;background:none;border:1px solid #ff5c35;color:#ff5c35;padding:10px;border-radius:10px;cursor:pointer;font-size:13px">⬇️ Story 9:16 (1080×1920)</button>
  </div>
  <div id="t5-preview-wrap" style="display:none;margin-bottom:16px">
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input id="t5-edit-place" placeholder="Локација" style="flex:1;background:#161616;border:1px solid #2a2a2a;color:#f5f0e8;padding:8px 12px;border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif">
      <input id="t5-edit-time" placeholder="Време" style="width:80px;background:#161616;border:1px solid #2a2a2a;color:#f5f0e8;padding:8px 12px;border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif">
      <input id="t5-edit-date" placeholder="Датум" style="flex:1;background:#161616;border:1px solid #2a2a2a;color:#f5f0e8;padding:8px 12px;border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif">
    </div>
    <button onclick="applyT5Edits()" style="width:100%;background:#1a1a2e;border:1px solid #ff5c35;color:#ff5c35;padding:10px;border-radius:10px;cursor:pointer;font-size:13px;margin-bottom:10px">🔄 Примени промени</button>
    <div id="t5-post" style="position:relative;width:100%;aspect-ratio:1/1;background:#0d0d0d;overflow:hidden;border-radius:12px">
      <img id="t5-bg" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#0d0d0d;display:none">
      <div id="t5-empty" style="position:absolute;top:0;left:0;right:0;bottom:0;background:#111;display:flex;align-items:center;justify-content:center"><span style="color:#333;font-size:13px">📷 Додај слика</span></div>
      <div class="t5-bottom-bar" style="position:absolute;bottom:0;left:0;right:0;height:52px;padding:0 16px;border-top:1px solid #222;display:flex;justify-content:space-between;align-items:center;background:#0d0d0d">
        <span id="t5-loc-preview" contenteditable="true" style="color:#777;font-size:11px;font-family:'DM Sans',sans-serif;outline:none;border-bottom:1px dashed transparent;transition:border-color 0.2s" onmouseover="this.style.borderBottomColor='#555'" onmouseout="this.style.borderBottomColor='transparent'">📍 · </span>
        <span id="t5-date-preview" contenteditable="true" style="color:#777;font-size:11px;font-family:'DM Sans',sans-serif;outline:none;border-bottom:1px dashed transparent;transition:border-color 0.2s" onmouseover="this.style.borderBottomColor='#555'" onmouseout="this.style.borderBottomColor='transparent'">📅 </span>
        <span style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:#ff5c2b">SkopjeVibes</span>
      </div>
    </div>
    <button id="t5-dl-btn" onclick="downloadT5()" style="width:100%;background:#ff5c35;color:#fff;border:none;border-radius:14px;padding:14px;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px">⬇ Симни (1080×1080)</button>
  </div>
  <button class="submit-btn" id="ai-btn" onclick="runAiAgent()" style="background:#1a1a2e;border:1px solid #ff5c35;margin-bottom:8px">✨ Пополни форма со AI</button>
  <div class="error-msg" id="ai-error">❌ AI грешка. Обиди се повторно.</div>
  <div id="ai-caption-box" style="display:none;margin-bottom:16px">
    <div class="form-group">
      <label>📸 Генерирана Instagram Caption</label>
      <textarea id="ai-caption" style="min-height:140px;border-color:#ff5c35" readonly></textarea>
    </div>
    <button onclick="navigator.clipboard.writeText(document.getElementById('ai-caption').value)" style="background:none;border:1px solid #2a2a2a;color:#aaa;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:12px;margin-bottom:16px">📋 Копирај Caption</button>
  </div>
  <hr style="border-color:#1f1f1f;margin:20px 0">

  <!-- ADD EVENT FORM -->
  <div class="section-title" id="form-title">+ Додај настан</div>

  <div class="form-group">
    <label>Наслов на настанот</label>
    <input type="text" id="f-title" placeholder="пр. Techno Night w/ DJ Marko" />
  </div>

  <div class="form-group">
    <label>Локал (пресет)</label>
    <select id="f-venue" onchange="applyVenuePreset()">
      <option value="">— Избери локал или внеси рачно —</option>
      <option value="Exit"            data-lat="42.0007" data-lng="21.4048" data-place="Club Exit">Club Exit</option>
      <option value="Colosseum"       data-lat="42.0015" data-lng="21.4257" data-place="Colosseum">Colosseum</option>
      <option value="Havana"          data-lat="41.9956" data-lng="21.4238" data-place="Club Havana">Club Havana</option>
      <option value="Marakana"        data-lat="42.0012" data-lng="21.4264" data-place="Marakana">Marakana</option>
      <option value="Chair"           data-lat="42.0010" data-lng="21.4183" data-place="Chair">Chair</option>
      <option value="MKC"             data-lat="41.9978" data-lng="21.4247" data-place="МКЦ">МКЦ</option>
      <option value="Filharmonija"    data-lat="42.0054" data-lng="21.4382" data-place="Филхармонија">Филхармонија</option>
      <option value="NacionalenTeatar" data-lat="41.9971" data-lng="21.4317" data-place="Национален театар">Национален театар</option>
      <option value="ArenaBT"         data-lat="41.9831" data-lng="21.4060" data-place="Арена Борис Трајковски">Арена Борис Трајковски</option>
      <option value="PublicRoom"      data-lat="41.9961" data-lng="21.4300" data-place="Public Room">Public Room</option>
      <option value="Tribeca"         data-lat="41.9959" data-lng="21.4322" data-place="Tribeca">Tribeca</option>
      <option value="DomNaArmijata"   data-lat="41.9975" data-lng="21.4319" data-place="Дом на армијата">Дом на армијата</option>
      <option value="JaneSandanski"   data-lat="42.0092" data-lng="21.4233" data-place="СЦ Јане Сандански">СЦ Јане Сандanski</option>
      <option value="MariotHotel"     data-lat="42.0019" data-lng="21.4354" data-place="Хотел Мариот">Хотел Мариот</option>
      <option value="Kale"            data-lat="42.0044" data-lng="21.4248" data-place="Кале">Кале</option>
    </select>
  </div>

  <div class="form-group">
    <label>Место / Клуб</label>
    <div class="place-row">
      <input type="text" id="f-place" placeholder="пр. Club Havana" />
      <button class="geo-btn" id="geo-btn" type="button" onclick="geocodePlace()">🔍 Најди координати</button>
    </div>
    <div class="geo-error" id="geo-error"></div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Латитуда (lat)</label>
      <input type="number" id="f-lat" placeholder="42.0003" step="0.0001" />
    </div>
    <div class="form-group">
      <label>Лонгитуда (lng)</label>
      <input type="number" id="f-lng" placeholder="21.4290" step="0.0001" />
    </div>
  </div>

  <div id="coord-map-wrap">
    <div id="coord-map"></div>
    <div class="coord-map-hint">Повлечи го пинот за да ја прецизираш локацијата</div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Категорија</label>
      <select id="f-kategorija">
        <option value="klub">🎧 Клуб</option>
        <option value="koncert">🎵 Концерт</option>
        <option value="bar">🍹 Бар</option>
        <option value="kafana">🍺 Кафана</option>
        <option value="sport-kultura">⚽ Спорт и Култура</option>
      </select>
    </div>
    <div class="form-group">
      <label>Emoji (за картичка)</label>
      <input type="text" id="f-emoji" placeholder="🎧" maxlength="4" />
    </div>
  </div>

  <div class="form-group">
    <label>Датум</label>
    <div class="date-row">
      <select id="f-day"></select>
      <select id="f-month"></select>
      <select id="f-year"></select>
    </div>
  </div>

  <div class="form-group">
    <label>Време</label>
    <input type="text" id="f-vreme" placeholder="20:00" />
  </div>

  <div class="form-group">
    <label>Слика (URL)</label>
    <div class="img-field-wrap">
      <input type="url" id="f-image-url" placeholder="https://..." />
      <button class="upload-btn" id="upload-btn" onclick="openCloudinary()" type="button">
        📷 Избери слика
      </button>
    </div>
  </div>

  <div class="form-group">
    <label>Локација (URL)</label>
    <input type="url" id="f-location" placeholder="https://maps.google.com/..." />
  </div>

  <div class="form-group">
    <label>Линк (може да биде Instagram, Facebook, ticket страна или било кој друг линк)</label>
    <input type="url" id="f-link" placeholder="https://..." />
  </div>

  <div class="form-group">
    <label>Badge (цена, промоција...)</label>
    <input type="text" id="f-badge" placeholder="пр. Free Entry до 24h · или остави празно" />
  </div>

  <div class="form-group">
    <label>Опис</label>
    <textarea id="f-desc" placeholder="Краток опис на настанот..."></textarea>
  </div>

  <button class="submit-btn" id="submit-btn" onclick="saveNastan()">Додај настан</button>
  <button class="cancel-btn" id="cancel-btn" onclick="cancelEdit()">Откажи</button>
  <div class="success-msg" id="success-msg">✅ Зачувано!</div>
  <div class="error-msg"   id="error-msg">❌ Грешка. Провери ги полињата.</div>

  <!-- EVENTS LIST -->
  <div class="events-section">
    <div class="section-title">Постоечки настани</div>
    <input type="text" id="events-search" placeholder="🔍 Пребарај настани по наслов..." oninput="filterEventsList(this.value)" />
    <div id="events-list"><div class="empty-list">Вчитување...</div></div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
<script>

  async function uploadImageToCloudinary(file) {
    // Convert to 1080x1350 with center crop
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = reject;
      i.src = URL.createObjectURL(file);
    });

    const W = 1080, H = 1350;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const scale = Math.max(W / img.width, H / img.height);
    const iw = img.width * scale;
    const ih = img.height * scale;
    const ix = (W - iw) / 2;
    const iy = (H - ih) / 2;
    ctx.drawImage(img, ix, iy, iw, ih);

    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.93));

    const formData = new FormData();
    formData.append('file', blob);
    formData.append('upload_preset', 'skopjevibes');
    formData.append('folder', 'skopjevibes');

    const res = await fetch('https://api.cloudinary.com/v1_1/dmvqjlvcj/image/upload', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    return data.secure_url;
  }

        return { ...VENUE_LOOKUP[key], canonicalName: key };
      }
    }
    return null;
  }

  const MK_BOUNDS = { latMin: 40.8, latMax: 42.4, lngMin: 20.4, lngMax: 23.1 };
  let geoRateTimer  = null;

  function sanitizeGeoQuery(raw) {
    return raw.trim().replace(/[<>"'`;&|$\\]/g, '').substring(0, 100);
  }

  function isInMacedonia(lat, lng) {
    return lat >= MK_BOUNDS.latMin && lat <= MK_BOUNDS.latMax &&
           lng >= MK_BOUNDS.lngMin && lng <= MK_BOUNDS.lngMax;
  }

  function setGeoBtn(state) {

    if (state === 'loading') {
      btn.disabled     = true;

    } else {
      // ready or cooldown — label resets; cooldown keeps disabled=true

  function showCoordMap(lat, lng) {
    const wrap = document.getElementById('coord-map-wrap');
    wrap.style.display = 'block';

    if (!coordMap) {
      coordMap = L.map('coord-map', {
        center: [lat, lng],
        zoom: 16,
        zoomControl: true,
        scrollWheelZoom: false,
        attributionControl: false,
      });
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        maxZoom: 19,
      }).addTo(coordMap);

      coordMarker = L.marker([lat, lng], { draggable: true }).addTo(coordMap);
      coordMarker.on('dragend', () => {
        const pos = coordMarker.getLatLng();
        document.getElementById('f-lat').value = pos.lat.toFixed(6);
        document.getElementById('f-lng').value = pos.lng.toFixed(6);
      });
    } else {
      coordMap.setView([lat, lng], 16);
      coordMarker.setLatLng([lat, lng]);
    }

    // Leaflet needs a tick to recalc size after display change
    setTimeout(() => coordMap.invalidateSize(), 50);
  }

  function hideCoordMap() {
    document.getElementById('coord-map-wrap').style.display = 'none';
  }

  async function geocodePlace() {
    const raw   = document.getElementById('f-place').value;
    const q     = sanitizeGeoQuery(raw);
    const errEl = document.getElementById('geo-error');
    errEl.style.display = 'none';

    if (!q) {
      errEl.textContent   = 'Внеси го името на местото прво.';
      errEl.style.display = 'block';
      return;
    }

    setGeoBtn('loading');

    try {
      const url = 'https://nominatim.openstreetmap.org/search?'
        + new URLSearchParams({ q: q + ' Skopje Macedonia', format: 'json', limit: '3' });

      const res = await fetch(url, {
        headers: { 'User-Agent': 'SkopjeVibes/1.0' }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const results = await res.json();

      const valid = results.find(r => {
        const lat = parseFloat(r.lat);
        const lng = parseFloat(r.lon);
        return Number.isFinite(lat) && Number.isFinite(lng) && isInMacedonia(lat, lng);
      });

      if (!valid) {
        errEl.textContent   = 'Не е пронајдено во Македонија. Провери го името или внеси координати рачно.';
        errEl.style.display = 'block';
      } else {
        const lat = parseFloat(valid.lat).toFixed(6);
        const lng = parseFloat(valid.lon).toFixed(6);
        document.getElementById('f-lat').value = lat;
        document.getElementById('f-lng').value = lng;
        showCoordMap(parseFloat(lat), parseFloat(lng));
      }
    } catch (err) {
      errEl.textContent   = 'Грешка при пребарување. Провери ја конекцијата.';
      errEl.style.display = 'block';
      console.error('Geocode error:', err);
    }

    // Rate limit: disable for 2 s after every request
    setGeoBtn('cooldown');
    clearTimeout(geoRateTimer);
    geoRateTimer = setTimeout(() => setGeoBtn('ready'), 2000);
  }

  async function runAiAgent() {
    const fileInput = document.getElementById('ai-image-input');
    const file = fileInput.files[0];
    if (!file) {
      alert('Прво прикачи слика!');
      return;
    }

    const btn = document.getElementById('ai-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Анализирање...';
    document.getElementById('ai-error').style.display = 'none';
    document.getElementById('ai-caption-box').style.display = 'none';

    try {
      // Convert image to base64
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const mediaType = file.type || 'image/jpeg';

      const response = await fetch('/api/ai-agent.js', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: base64, mediaType })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);

      const text = data.content[0].text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(text);

      if (parsed.title)        document.getElementById('f-title').value      = parsed.title;
      if (parsed.place)        document.getElementById('f-place').value      = parsed.place;
      const coords = lookupVenueCoords(parsed.place);
      if (coords) {
        document.getElementById('f-place').value = coords.canonicalName;
        document.getElementById('f-lat').value = coords.lat;
        document.getElementById('f-lng').value = coords.lng;
        showCoordMap(coords.lat, coords.lng);
      }
      if (parsed.kategorija)   document.getElementById('f-kategorija').value = parsed.kategorija;
      if (parsed.vreme)        document.getElementById('f-vreme').value      = parsed.vreme;
      if (parsed.badge)        document.getElementById('f-badge').value      = parsed.badge;
      if (parsed.desc)         document.getElementById('f-desc').value       = parsed.desc;
      if (parsed.instagramUrl) document.getElementById('f-link').value       = parsed.instagramUrl;
      if (parsed.caption)      document.getElementById('ai-caption').value   = parsed.caption;

      if (parsed.datum) {
        const [y, m, d] = parsed.datum.split('-');
        document.getElementById('f-year').value  = y;
        document.getElementById('f-month').value = m;
        document.getElementById('f-day').value   = d;
      }

      try {
        const imgUrl = await uploadImageToCloudinary(file);
        if (imgUrl) document.getElementById('f-image-url').value = imgUrl;
      } catch (e) {
        console.error('Cloudinary upload failed:', e);
      }

      document.getElementById('ai-caption-box').style.display = 'block';

    } catch (err) {
      console.error(err);
      document.getElementById('ai-error').style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ Пополни форма со AI';
    }
  }

    document.getElementById('t5-edit-date').value  = dateStr;

    document.getElementById('t5-loc-preview').textContent = `📍 ${place} · ${time}`;
    document.getElementById('t5-date-preview').textContent = `📅 ${dateStr}`;

    if (file) {
      const url = URL.createObjectURL(file);
      const bg = document.getElementById('t5-bg');
      bg.src = url;
      bg.style.display = 'block';
      document.getElementById('t5-empty').style.display = 'none';
    }
    document.getElementById('t5-preview-wrap').style.display = 'block';
    document.getElementById('t5-preview-wrap').scrollIntoView({behavior:'smooth'});
  }

  function applyT5Edits() {
    const place = document.getElementById('t5-edit-place').value.trim();
    const time = document.getElementById('t5-edit-time').value.trim();
    const date = document.getElementById('t5-edit-date').value.trim();
    if (place || time) document.getElementById('t5-loc-preview').textContent = `📍 ${place} · ${time}`;
    if (date) document.getElementById('t5-date-preview').textContent = `📅 ${date}`;
  }

  function downloadT5() {
    const post = document.getElementById('t5-post');
    const name = document.getElementById('f-title').value.trim().replace(/\s+/g,'-').toLowerCase() || 'event';
    html2canvas(post, {scale: 1080/post.offsetWidth, useCORS:true}).then(canvas => {
      const a = document.createElement('a');
      a.download = `${name}-template5.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    });
  }

  function convertImage(type) {
    const file = document.getElementById('ai-image-input').files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const W = 1080;
      const H = type === 'post' ? 1350 : 1920;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      if (type === 'story') {
        // Blurry background + centered image
        const scaleBg = Math.max(W / img.width, H / img.height);
        const bw = img.width * scaleBg, bh = img.height * scaleBg;
        const bx = (W - bw) / 2, by = (H - bh) / 2;
        ctx.filter = 'blur(24px)';
        ctx.drawImage(img, bx, by, bw, bh);
        ctx.filter = 'none';
        const scaleFg = Math.min(W / img.width, H / img.height);
        const iw = img.width * scaleFg, ih = img.height * scaleFg;
        const ix = (W - iw) / 2, iy = (H - ih) / 2;
        ctx.drawImage(img, ix, iy, iw, ih);
      } else {
        // Crop for post
        const scale = Math.max(W / img.width, H / img.height);
        const iw = img.width * scale;
        const ih = img.height * scale;
        const ix = (W - iw) / 2;
        const iy = (H - ih) / 2;
        ctx.drawImage(img, ix, iy, iw, ih);
      }

      const a = document.createElement('a');
      const name = document.getElementById('f-title').value.trim().replace(/\s+/g, '-').toLowerCase() || 'event';
      a.download = `${name}-${type}.jpg`;
      a.href = canvas.toDataURL('image/jpeg', 0.93);
      a.click();
    };
    img.src = URL.createObjectURL(file);
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
